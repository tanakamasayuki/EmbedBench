sentence=Board-side capture shims for EmbedBench: I2C, serial, SPI, and the lines a part drives.
paragraph=A TwoWire that records what the application does on the bus, one line per transfer in the event grammar EmbedBench's tools read, so a session on real hardware becomes the scaffold of a device model (trace2regtable.py) or a replayable tape (trace2tape.py). Runs on the board; kept apart from the host library so neither side carries the other.
category=Other
url=https://github.com/tanakamasayuki/EmbedBench
architectures=*
includes=CaptureWire.h,CaptureSerial.h,CaptureSPI.h,CaptureLines.h
