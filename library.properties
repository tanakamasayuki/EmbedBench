sentence=Host-side verification for embedded applications, with no hardware attached.
paragraph=Runs unmodified Arduino sketches against device models on a virtual clock, recording one line per event so a run is reproducible and can be read back. The boundary device models are written against is frozen and portable; the environment that hosts them is platform-specific. The physical layer is deliberately out of scope. Device models ship separately as EmbedBenchDevices.
